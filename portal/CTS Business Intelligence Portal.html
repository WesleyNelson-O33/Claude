<!DOCTYPE html>
<html lang="en-AU" data-palette="#F33A45,#0E9E99,#B7850A,#2E4DA6,#6C70FF,#018301">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTS Business Intelligence Portal</title>
<meta name="description" content="Corporate Technology Services financial reporting. Runs entirely in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------- tokens
   The official CTS Seamless AV palette (cts_pantonevalues.pdf): black
   #121820, mint #3FD0C9 (Production), lavender #6D71FF (Consulting), rose
   #F33844 (Support), with dark teal #005358, navy #122B82 and burgundy
   #A8052E as the text-safe variants. Chart series are those hues snapped
   into the lightness band the colour vision checks need, and validated as
   a set in both modes (adjacent CVD deltaE >= 13 light, >= 13 dark; the
   navy on the dark surface sits under 3:1 so every chart carries a table). */
:root {
  color-scheme: light;
  --fs: 14px;
  --surface-0: #F3F5F8;
  --surface-1: #FFFFFF;
  --surface-2: #F6F7F9;
  --surface-3: #E9ECF1;
  --ink-strong: #121820;
  --ink: #1E2530;
  --ink-secondary: #3E4650;
  --ink-muted: #5F6670;
  --line: #DDE1E7;
  --line-strong: #C3C9D2;
  --brand-ink: #121820;
  --accent: #122B82;             /* navy: links, active state, primary buttons */
  --accent-ink: #FFFFFF;
  --accent-soft: #EEEEFF;
  --mint: #3FD0C9; --lavender: #6D71FF; --rose: #F33844;
  --teal: #005358; --navy: #122B82; --burgundy: #A8052E;
  --side-bg: #FFFFFF; --side-ink: #3E4650; --side-ink-strong: #121820; --side-line: #DDE1E7; --side-hover: #F3F5F8;

  /* departments, fixed order: Onsite, Production, Video, Integration, Consulting, Admin, Unallocated */
  --series-1: #F33A45;  /* Onsite       Support rose            */
  --series-2: #0E9E99;  /* Production   Production mint, deeper */
  --series-3: #B7850A;  /* Video        no brand hue, amber     */
  --series-4: #2E4DA6;  /* Integration  Consulting navy         */
  --series-5: #6C70FF;  /* Consulting   Consulting lavender     */
  --series-6: #018301;  /* Admin        no brand hue, green     */
  --series-7: #7B8391;  /* Unallocated                          */
  --measure-1: #2E4DA6;  /* revenue        */
  --measure-2: #0E9E99;  /* gross profit   */
  --measure-3: #B7850A;  /* net profit     */

  --status-good: #0B8F3A;
  --status-warning: #C98A00;
  --status-serious: #D2601E;
  --status-critical: #C81E2B;
  --good-bg: #0B8F3A1F; --warn-bg: #C98A0026; --crit-bg: #C81E2B1F;
  --good-ink: #0A6B2C; --warn-ink: #7D5600; --crit-ink: #A0161F;

  --radius: 10px; --radius-sm: 6px;
  --display: "Sora", "Tomato Grotesk", "Segoe UI", Calibri, sans-serif;
  --sans: "Figtree", "Tomato Grotesk", "Segoe UI", Calibri, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px #12182012, 0 6px 20px -12px #12182033;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #0E131A; --surface-1: #161C25; --surface-2: #1D2530; --surface-3: #263040;
    --ink-strong: #FFFFFF; --ink: #F2F4F7; --ink-secondary: #C9CED6; --ink-muted: #98A1AD;
    --line: #2A3441; --line-strong: #3A4655;
    --brand-ink: #FFFFFF; --accent: #3FD0C9; --accent-ink: #121820; --accent-soft: #163A3D;
  --side-bg: #121820; --side-ink: #C9CED6; --side-ink-strong: #FFFFFF; --side-line: #232B36; --side-hover: #1B2330;
    --series-1: #F33A45; --series-2: #14A3A3; --series-3: #C0830A;
    --series-4: #3358C6; --series-5: #7A81F5; --series-6: #2E9E2E; --series-7: #98A1AD;
    --measure-1: #7A81F5; --measure-2: #14A3A3; --measure-3: #C0830A;
    --status-good: #3DC06A; --status-warning: #F0B429; --status-serious: #F0885A; --status-critical: #F26D77;
    --good-bg: #3DC06A24; --warn-bg: #F0B42926; --crit-bg: #F26D7724;
    --good-ink: #6FD690; --warn-ink: #F5C651; --crit-ink: #F7969D;
    --shadow: 0 1px 2px #00000040, 0 8px 24px -14px #00000080;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #0E131A; --surface-1: #161C25; --surface-2: #1D2530; --surface-3: #263040;
  --ink-strong: #FFFFFF; --ink: #F2F4F7; --ink-secondary: #C9CED6; --ink-muted: #98A1AD;
  --line: #2A3441; --line-strong: #3A4655;
  --brand-ink: #FFFFFF; --accent: #3FD0C9; --accent-ink: #121820; --accent-soft: #163A3D;
  --side-bg: #121820; --side-ink: #C9CED6; --side-ink-strong: #FFFFFF; --side-line: #232B36; --side-hover: #1B2330;
  --series-1: #F33A45; --series-2: #14A3A3; --series-3: #C0830A;
  --series-4: #3358C6; --series-5: #7A81F5; --series-6: #2E9E2E; --series-7: #98A1AD;
  --measure-1: #7A81F5; --measure-2: #14A3A3; --measure-3: #C0830A;
  --status-good: #3DC06A; --status-warning: #F0B429; --status-serious: #F0885A; --status-critical: #F26D77;
  --good-bg: #3DC06A24; --warn-bg: #F0B42926; --crit-bg: #F26D7724;
  --good-ink: #6FD690; --warn-ink: #F5C651; --crit-ink: #F7969D;
  --shadow: 0 1px 2px #00000040, 0 8px 24px -14px #00000080;
}
:root[data-textsize="large"] { --fs: 16px; }
:root[data-textsize="larger"] { --fs: 18px; }
:root[data-contrast="high"] { --ink: #000000; --ink-secondary: #000000; --ink-muted: #2B313A; --line: #8A929E; --line-strong: #5F6670; }
:root[data-contrast="high"][data-theme="dark"], :root[data-contrast="high"]:where(:not([data-theme="light"])) { --ink: #FFFFFF; --ink-secondary: #FFFFFF; --ink-muted: #DDE1E7; --line: #6B7684; --line-strong: #98A1AD; }

/* ----------------------------------------------------------------- base */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { font-size: var(--fs); }
body {
  background: var(--surface-0); color: var(--ink);
  font: 1rem/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
h1, h2, h3, .tile-value, .brand-name { font-family: var(--display); text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.skip { position: absolute; left: -999px; top: .5rem; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: .5rem .8rem; border-radius: var(--radius-sm); font-weight: 600; }
.skip:focus { left: .5rem; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.shell[data-side="hidden"] { grid-template-columns: minmax(0, 1fr); }
.shell[data-side="hidden"] .side { display: none; }
.side {
  background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line);
  padding: 0 0 2rem; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; scrollbar-width: thin;
}
.brand { padding: 1.15rem 1.1rem .9rem; border-bottom: 1px solid var(--side-line); }
.brand-logo { display: block; width: 100%; max-width: 150px; height: auto; margin: 0 0 .7rem; }
.brand-name { font-weight: 700; color: var(--side-ink-strong); letter-spacing: -.01em; font-size: 15px; }
.brand-sub { font-size: 11px; color: var(--side-ink); margin-top: 2px; opacity: .8; }
.brand-meta { display: flex; gap: .4rem; align-items: center; margin-top: .6rem; flex-wrap: wrap; }
.badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; font-weight: 700; }
.badge-warn { background: var(--warn-bg); color: var(--warn-ink); }
.badge-good { background: var(--good-bg); color: var(--good-ink); }
.rm { font-size: 11px; color: var(--side-ink); }
.whoami { margin-top: .7rem; }
.whoami-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--side-ink); opacity: .75; font-weight: 700; margin-bottom: .25rem; }
.whoami select { width: 100%; background: var(--side-hover); color: var(--side-ink-strong); border-color: var(--side-line); }
.whoami-role { font-size: 11px; color: var(--side-ink); margin-top: .3rem; display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
.btn.small { font-size: 11px; padding: .15rem .45rem; }

#nav { flex: 1; padding-top: .4rem; }
.nav-tools { display: flex; gap: .4rem; padding: .6rem 1.1rem 0; }
.nav-tools button { font: inherit; font-size: 11px; background: transparent; color: var(--side-ink); border: 1px solid var(--side-line); border-radius: 99px; padding: .15rem .6rem; cursor: pointer; }
.nav-tools button:hover { background: var(--side-hover); color: var(--side-ink-strong); }
.nav-group { padding: .55rem 0 0; }
.nav-head {
  display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
  font: inherit; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700;
  color: var(--side-ink); background: transparent; border: 0; padding: .35rem 1.1rem; cursor: pointer;
}
.nav-head:hover { color: var(--side-ink-strong); }
.nav-head .sec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sec, var(--mint)); flex: none; }
.nav-head .chev { margin-left: auto; width: 14px; height: 14px; transition: transform .15s; opacity: .7; }
.nav-group[data-collapsed="1"] .nav-head .chev { transform: rotate(-90deg); }
.nav-group[data-collapsed="1"] .nav-list { display: none; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-link {
  display: block; padding: .34rem 1.1rem .34rem 1.85rem; color: var(--side-ink);
  text-decoration: none; font-size: 13px; border-left: 3px solid transparent;
}
.nav-link:hover { background: var(--side-hover); color: var(--side-ink-strong); }
.nav-link.on { background: var(--side-hover); color: var(--side-ink-strong); border-left-color: var(--sec, var(--mint)); font-weight: 600; }
.side-foot { display: none; }
.btn-theme, .btn-side {
  font: inherit; font-size: 12px; background: transparent; color: var(--side-ink);
  border: 1px solid var(--side-line); border-radius: 99px; padding: .3rem .7rem; cursor: pointer;
}
.btn-theme:hover, .btn-side:hover { background: var(--side-hover); color: var(--side-ink-strong); }
.side-mark { padding: .8rem 1.1rem 0; font-size: 10.5px; color: var(--side-ink); opacity: .7; }

main { padding: 0 1.8rem 5rem; max-width: 1560px; min-width: 0; }

/* ------------------------------------------------------------ page head */
.page-head {
  position: sticky; top: 0; z-index: 20; margin: 0 -1.8rem 1.1rem; padding: 1rem 1.8rem .8rem;
  background: var(--surface-0); display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap;
}
.page-head::after {
  content: ""; position: absolute; left: 1.8rem; right: 1.8rem; bottom: 0; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, var(--mint), var(--lavender) 50%, var(--rose));
}
.page-head .titles { min-width: 0; flex: 1 1 20rem; }
.page-head h1 { font-size: 26px; margin: 0; color: var(--brand-ink); letter-spacing: -.02em; line-height: 1.15; }
.page-sub { margin: .15rem 0 0; color: var(--ink-secondary); font-size: 13.5px; }
.page-tools { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.tool {
  font: inherit; font-size: 12px; padding: .32rem .7rem; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface-1); color: var(--ink-secondary);
  display: inline-flex; align-items: center; gap: .35rem; min-height: 32px;
}
.tool:hover { color: var(--ink-strong); border-color: var(--ink-muted); }
.tool.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tool svg { width: 14px; height: 14px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--sec, var(--accent)); margin-bottom: .2rem; font-family: var(--display); }

/* -------------------------------------------------------------- banners */
.banner {
  border-radius: var(--radius); padding: .7rem .9rem; margin: 0 0 1rem;
  font-size: 13px; border: 1px solid var(--line); background: var(--surface-1); box-shadow: var(--shadow);
}
.banner-seed { border-left: 4px solid var(--status-warning); }
.banner-warn { border-left: 4px solid var(--status-serious); }
.banner-good { border-left: 4px solid var(--status-good); }

/* -------------------------------------------------------------- toolbar */
.toolbar {
  display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
  margin: 0 0 1rem; padding: .5rem .6rem; background: var(--surface-1);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.toolbar-right { margin-left: auto; display: flex; gap: .45rem; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 99px; overflow: hidden; padding: 2px; background: var(--surface-2); gap: 2px; }
.seg-btn {
  font: inherit; font-size: 12.5px; padding: .28rem .8rem; border: 0; cursor: pointer; border-radius: 99px;
  background: transparent; color: var(--ink-secondary); min-height: 30px;
}
.seg-btn:hover { color: var(--ink-strong); }
.seg-btn.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.control {
  font: inherit; font-size: 13px; padding: .3rem .5rem; border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); background: var(--surface-1); color: var(--ink); max-width: 20rem; min-height: 32px;
}
.control.small { font-size: 12px; padding: .15rem .3rem; min-height: 28px; }
.control.grow { flex: 1 1 18rem; max-width: none; }
label.inline { font-size: 12px; color: var(--ink-muted); }
.readout { font-weight: 600; color: var(--ink-strong); }
.checkbox { font-size: 13px; color: var(--ink-secondary); cursor: pointer; }
.btn {
  font: inherit; font-size: 13px; font-weight: 600; padding: .42rem .95rem; border-radius: 99px; min-height: 34px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn-quiet { background: var(--surface-1); color: var(--ink); border-color: var(--line-strong); font-weight: 500; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
.fieldrow {
  display: grid; grid-template-columns: minmax(12rem, 20rem) auto 1fr; gap: .7rem;
  align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--line);
}
.fieldrow label { color: var(--ink-secondary); }

/* ---------------------------------------------------------------- tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: .8rem; margin-bottom: 1.3rem; }
.tile {
  position: relative; background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .85rem 1rem .8rem; box-shadow: var(--shadow); overflow: hidden;
}
.tile::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--sec, var(--accent)); opacity: .9; }
.tile-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); font-weight: 700; }
.tile-value { font-size: 28px; font-weight: 700; color: var(--ink-strong); letter-spacing: -.02em; margin: .2rem 0 .1rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile-sub { font-size: 12.5px; color: var(--ink-secondary); }
.tile-note { font-size: 11.5px; color: var(--ink-muted); margin-top: .25rem; }
.tone-good::before { background: var(--status-good); }
.tone-critical::before { background: var(--status-critical); }
.tone-warning::before { background: var(--status-warning); }
.tone-good .tile-value { color: var(--good-ink); }
.tone-critical .tile-value { color: var(--crit-ink); }
.up { color: var(--good-ink); }
.down { color: var(--crit-ink); }

/* -------------------------------------------------------------- blocks */
.block {
  margin: 0 0 1.1rem; min-width: 0; background: var(--surface-1); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.block-head {
  display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; font: inherit;
  background: transparent; border: 0; padding: .8rem 1rem; cursor: pointer; color: var(--ink-strong);
  border-left: 4px solid var(--sec, var(--accent));
}
.block-head:hover { background: var(--surface-2); }
.block-head h2 { font-size: 15.5px; margin: 0; color: var(--ink-strong); letter-spacing: -.01em; flex: 1; }
.block-head .chev { width: 16px; height: 16px; color: var(--ink-muted); transition: transform .15s; flex: none; }
.block[data-collapsed="1"] .block-head .chev { transform: rotate(-90deg); }
.block[data-collapsed="1"] .block-body { display: none; }
.block-body { padding: .2rem 1rem 1rem; border-left: 4px solid transparent; }
.block-body > .note:first-child { margin-top: 0; }
.note { font-size: 13px; color: var(--ink-secondary); margin: .35rem 0 .7rem; max-width: 78ch; line-height: 1.55; }
.note-warn { color: var(--ink); border-left: 3px solid var(--status-serious); padding-left: .7rem; }
.note-muted { color: var(--ink-muted); }
.source { font-size: 12px; color: var(--ink-muted); margin: .4rem 0 0; }
.source-tag { text-transform: uppercase; font-size: 10px; letter-spacing: .05em; font-weight: 700; color: var(--ink-muted); }
.muted { color: var(--ink-muted); font-size: 12px; }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
ul.plain { list-style: none; margin: .3rem 0; padding: 0; }
ul.plain li { padding: .25rem 0; border-bottom: 1px solid var(--line); display: flex; gap: .6rem; }
ul.plain li:last-child { border-bottom: 0; }
.li-name { flex: 1; }
.li-val { font-variant-numeric: tabular-nums; color: var(--ink-secondary); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .8rem; }
.card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem .95rem; }
.card h3 { font-size: 13.5px; margin: 0 0 .4rem; color: var(--ink-strong); }
.keeprow { margin-top: .6rem; }
.steps { counter-reset: step; }
.step { display: grid; grid-template-columns: 2.2rem 1fr; gap: .6rem; padding: .85rem 0; border-bottom: 1px solid var(--line); }
.step-n { width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; font-family: var(--display); }
.step h3 { margin: .15rem 0 .3rem; font-size: 14.5px; color: var(--ink-strong); }
.check-ok { color: var(--good-ink); } .check-warn { color: var(--warn-ink); } .check-fail { color: var(--crit-ink); }
.preview { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.keepmsg:empty { display: none; }
.keepbox { margin-top: .6rem; }
.keepbox textarea.paste, .loader textarea.paste, textarea.commentary-text {
  width: 100%; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  padding: .5rem; background: var(--surface-0); color: var(--ink); resize: vertical;
}
textarea.commentary-text { font-family: var(--sans); font-size: 13.5px; line-height: 1.5; min-height: 5.5rem; }

/* ----------------------------------------------------------- commentary */
.commentary { margin: 0 0 1.1rem; border: 1px solid var(--line); border-left: 4px solid var(--lavender); border-radius: var(--radius); background: var(--surface-1); box-shadow: var(--shadow); }
.commentary-head { display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem .3rem; }
.commentary-head h2 { font-size: 14px; margin: 0; flex: 1; color: var(--ink-strong); }
.commentary-body { padding: 0 1rem .8rem; }
.commentary-item { padding: .55rem 0; border-top: 1px solid var(--line); }
.commentary-item:first-child { border-top: 0; }
.commentary-meta { font-size: 11.5px; color: var(--ink-muted); margin-bottom: .2rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.commentary-text-view { font-size: 13.5px; line-height: 1.55; color: var(--ink); white-space: pre-wrap; max-width: 78ch; }
.commentary-empty { font-size: 13px; color: var(--ink-muted); padding: .3rem 0 .5rem; }
.commentary-form { display: grid; gap: .5rem; margin-top: .5rem; }
.commentary-form .row { margin-top: 0; }

/* -------------------------------------------------------------- tables */
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-1); max-height: 70vh; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: .38rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid.dense th, table.grid.dense td { padding: .25rem .55rem; font-size: 12.5px; }
table.grid th {
  background: var(--surface-2); color: var(--ink-secondary); font-size: 11px;
  text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
  position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--line-strong);
}
table.grid td.left, table.grid th.left { text-align: left; }
table.grid td.right, table.grid th.right { text-align: right; }
table.grid tbody tr:hover { background: var(--surface-2); }
table.grid td.left { white-space: normal; min-width: 9rem; }
td.neg { color: var(--crit-ink); }
th.totalcol, td.totalcol { border-left: 1px solid var(--line-strong); font-weight: 600; }
th.forecast-col { color: var(--ink-muted); font-style: italic; }
tr.forecast td { color: var(--ink-muted); background: color-mix(in srgb, var(--lavender) 6%, transparent); }
tr.totalrow td { font-weight: 700; background: var(--surface-2); color: var(--ink-strong); }
tr.pnl-lvl0 td { font-weight: 700; background: var(--surface-2); color: var(--ink-strong); }
tr.pnl-lvl1 td { font-weight: 600; }
tr.pnl-lvl2 td { color: var(--ink-secondary); }
.pnl-label { display: inline-flex; align-items: center; gap: .35rem; }
.lvl1 { padding-left: .9rem; }
.lvl2 { padding-left: 1.9rem; }
.twisty {
  font: inherit; width: 18px; height: 18px; line-height: 1; padding: 0; cursor: pointer;
  border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-1); color: var(--ink-secondary);
}
.twisty-spacer { display: inline-block; width: 18px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: .45rem; vertical-align: -1px; }

/* --------------------------------------------------------- chips, flags */
.chip, .risk, .flag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: .01em; }
.risk-good, .chip-good, .flag-good { background: var(--good-bg); color: var(--good-ink); }
.risk-warning, .chip-warning, .flag-warn { background: var(--warn-bg); color: var(--warn-ink); }
.risk-critical, .chip-critical { background: var(--crit-bg); color: var(--crit-ink); }
.risk-muted, .chip-muted { background: var(--surface-3); color: var(--ink-muted); }

/* -------------------------------------------------------------- charts */
.fig { margin: 0; }
.fig figcaption { font-size: 12.5px; color: var(--ink-muted); margin-bottom: .45rem; }
.fig-chart, .fig-table { min-width: 0; }
.fig-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: .9rem; align-items: start; }
.fig-table .tablewrap { max-height: 380px; }
.chartwrap { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .6rem; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .zero { stroke: var(--line-strong); stroke-width: 1.5; }
svg.chart .connector { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 2 2; }
svg.chart .targetline { stroke: var(--ink-muted); stroke-width: 1.5; stroke-dasharray: 5 3; }
svg.chart text.tick { fill: var(--ink-muted); font: 11px var(--sans); }
svg.chart text.value { fill: var(--ink-secondary); font-weight: 600; }
svg.chart .mark { transition: opacity .12s; }
.chartwrap:hover .mark { opacity: .78; }
.chartwrap .mark:hover { opacity: 1; }
.charttip {
  position: absolute; pointer-events: none; background: var(--ink-strong); color: var(--surface-1);
  font-size: 12px; padding: .35rem .55rem; border-radius: 6px; z-index: 5; max-width: 220px; box-shadow: 0 2px 10px #0003;
}
.legend { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0 0 .45rem; font-size: 12.5px; color: var(--ink-secondary); }
.legend-item { display: inline-flex; align-items: center; gap: .35rem; }
.swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }


/* ------------------------------------------------ tiles as links, sparks */
a.tile { display: block; color: inherit; text-decoration: none; transition: transform .12s, box-shadow .12s; }
a.tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px -8px #12182055; }
.tile-go { position: absolute; right: .8rem; top: .7rem; color: var(--ink-muted); font-size: 14px; }
.spark { width: 100%; max-width: 140px; height: 28px; display: block; margin-top: .35rem; }
svg.chart .mark.clickable { cursor: pointer; }
.filterchip { display: inline-flex; align-items: center; gap: .4rem; font-size: 12px; padding: .25rem .4rem .25rem .7rem; border-radius: 99px; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
.filterchip button { font: inherit; font-size: 14px; line-height: 1; border: 0; background: transparent; color: var(--ink-secondary); cursor: pointer; padding: 0 .3rem; border-radius: 99px; }
.filterchip button:hover { color: var(--crit-ink); }

/* ------------------------------------------------------- cover strip */
.cover { display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: #121820; color: #FFFFFF; border-radius: var(--radius); padding: 1rem 1.3rem; margin: 0 0 1.1rem; position: relative; overflow: hidden; border-left: 6px solid var(--cover, var(--mint)); }
.cover::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: var(--cover, var(--mint)); opacity: .18; }
.cover .eyebrow { color: var(--cover, var(--mint)); }
.cover h2 { margin: 0; font-size: 22px; color: #FFFFFF; }
.cover p { margin: .3rem 0 0; color: #C9CED6; font-size: 13px; max-width: 60ch; }
.cover img { height: 64px; width: auto; position: relative; }

/* ---------------------------------------------------------- the month */
.story { display: grid; gap: .8rem; }
.storycard { display: grid; grid-template-columns: 2.6rem 1fr; gap: .8rem; align-items: start; background: var(--surface-1); border: 1px solid var(--line); border-left: 5px solid var(--sec); border-radius: var(--radius); padding: .9rem 1rem; color: inherit; text-decoration: none; box-shadow: var(--shadow); }
.storycard:hover { transform: translateY(-1px); }
.storycard.tone-good { border-left-color: var(--status-good); } .storycard.tone-warning { border-left-color: var(--status-warning); } .storycard.tone-critical { border-left-color: var(--status-critical); }
.story-n { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--ink-muted); line-height: 1; padding-top: .1rem; }
.storycard h3 { margin: 0 0 .25rem; font-size: 16px; color: var(--ink-strong); }
.storycard p { margin: 0; font-size: 13.5px; color: var(--ink-secondary); max-width: 78ch; }

/* --------------------------------------------------------- shortcuts */
.help { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; width: min(28rem, calc(100vw - 2rem)); background: var(--surface-1); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 12px 40px -12px #00000066; padding: .9rem 1rem; }
.help-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .5rem; }
.help h2 { margin: 0; font-size: 15px; }
.help dl { display: grid; grid-template-columns: auto 1fr; gap: .35rem .8rem; margin: 0; font-size: 13px; }
.help dt { text-align: right; } .help dd { margin: 0; color: var(--ink-secondary); }
kbd { font: 11px var(--mono); background: var(--surface-2); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink-strong); white-space: nowrap; }

/* -------------------------------------------------------------- splash */
#splash {
  position: fixed; inset: 0; background: #121820; color: #FFFFFF; display: grid; place-items: center;
  z-index: 50; text-align: center; padding: 1rem; overflow: hidden; font-family: var(--sans);
}
#splash .orb { position: absolute; border-radius: 50%; filter: blur(2px); }
#splash .orb-1 { width: 46vmax; height: 46vmax; right: -12vmax; top: -18vmax; background: #3FD0C9; opacity: .55; }
#splash .orb-2 { width: 40vmax; height: 40vmax; right: -16vmax; top: 18vmax; background: #6D71FF; opacity: .5; }
#splash .orb-3 { width: 36vmax; height: 36vmax; right: -4vmax; top: 44vmax; background: #F33844; opacity: .45; }
#splash .splash-inner { position: relative; max-width: 30rem; }
#splash img { width: min(300px, 70vw); height: auto; display: block; margin: 0 auto 1.4rem; }
#splash h1 { font-family: var(--display); font-size: 22px; margin: 0 0 .3rem; color: #FFFFFF; letter-spacing: -.01em; }
#splash p { color: #C9CED6; margin: .2rem 0; font-size: 14px; }
#splash .bar { height: 4px; background: #232B36; border-radius: 2px; margin: 1rem auto .5rem; width: min(280px, 60vw); overflow: hidden; }
#splash .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3FD0C9, #6D71FF, #F33844); transition: width .2s; }
#splash .marks { display: flex; gap: 1.4rem; justify-content: center; margin-top: 1.6rem; opacity: .85; }
#splash .marks img { width: 84px; margin: 0; }
.fatal { max-width: 34rem; border-left: 3px solid #F33844; padding-left: 1rem; text-align: left; }
.fatal code { color: #3FD0C9; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; }
  main { padding: 0 1rem 4rem; }
  .page-head { margin: 0 -1rem 1rem; padding: .8rem 1rem .7rem; }
  .page-head::after { left: 1rem; right: 1rem; }
  .fieldrow { grid-template-columns: 1fr; }
}
@media (max-width: 480px) { .page-head h1 { font-size: 22px; } .tile-value { font-size: 24px; } }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <div class="splash-inner">
    <img id="splashlogo" alt="cts Seamless AV" hidden>
    <h1>Business Intelligence</h1>
    <p id="splashmsg">Loading the data files&hellip;</p>
    <div class="bar"><span id="splashbar"></span></div>
    <div class="marks" id="splashmarks"></div>
  </div>
</div>
<a class="skip" href="#main">Skip to content</a>

<div class="shell">
  <aside class="side" aria-label="Portal">
    <div class="brand">
      <img id="brandlogo" class="brand-logo" alt="cts Seamless AV" hidden>
      <div class="brand-name">Business Intelligence</div>
      <div class="brand-sub">Corporate Technology Services</div>
      <div class="brand-meta">
        <span id="databadge" class="badge">&nbsp;</span>
        <span id="rmlabel" class="rm"></span>
      </div>
      <div id="whoami" class="whoami"></div>
    </div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-mark">Corporate Technology Services &nbsp;|&nbsp; Seamless AV</div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
/* Each data file is loaded with its own error handler so one missing file
   cannot stop the rest, and so the portal can say exactly which one failed.
   Mandatory files take the portal down with a message; the rest degrade. */
(function () {
  var MANDATORY = ["CTS_config_data", "CTS_cal_data", "CTS_accounts_data",
                   "CTS_gl_data", "CTS_fin_data"];
  var OPTIONAL = ["CTS_util_data", "CTS_clients_data", "CTS_users_data", "CTS_staff_data",
                  "CTS_brand_data", "CTS_pipeline_data", "CTS_forecast_data", "CTS_cash_data", "CTS_commentary_data", "CTS_distribution_data"];
  var queue = MANDATORY.concat(OPTIONAL);
  var failed = [];
  var i = 0;

  function progress(name) {
    try {
      var bar = document.getElementById("splashbar"), msg = document.getElementById("splashmsg");
      if (bar) bar.style.width = Math.round(100 * i / (queue.length + 4)) + "%";
      if (msg) msg.textContent = "Loading " + name.replace(/^CTS_|_data$/g, "").replace(/_/g, " ") + "\u2026";
      if (window.CTS_BRAND && !window.__splashLogo) {
        window.__splashLogo = true;
        var b = window.CTS_BRAND, img = document.getElementById("splashlogo"), marks = document.getElementById("splashmarks");
        if (img && b.logo) { img.src = b.logo.dark; img.hidden = false; }
        if (marks && b.marks) ["production", "consulting", "support"].forEach(function (k) {
          if (!b.marks[k]) return; var m = document.createElement("img"); m.src = b.marks[k].onDark; m.alt = b.marks[k].alt; marks.appendChild(m);
        });
      }
    } catch (e) {}
  }
  function next() {
    if (i >= queue.length) return finish();
    var name = queue[i++];
    progress(name);
    var s = document.createElement("script");
    s.src = "data/" + name + ".js";
    s.onload = next;
    s.onerror = function () {
      failed.push(name);
      if (MANDATORY.indexOf(name) >= 0) {
        document.getElementById("splash").innerHTML =
          '<div class="fatal"><h1>Data load error</h1><p>Could not load <code>data/' +
          name + '.js</code>, which the portal cannot run without.</p>' +
          '<p class="small">If you opened this file directly, some browsers block ' +
          'loading sibling files from a file:// path. Serve the folder instead: ' +
          '<code>python -m http.server 3000</code> from the portal folder, then open ' +
          '<code>http://localhost:3000/</code>.</p></div>';
        return;
      }
      console.warn("Optional data file missing: " + name);
      next();
    };
    document.head.appendChild(s);
  }

  function finish() {
    if (failed.length) console.warn("Data files that did not load:", failed.join(", "));
    // Vendored SheetJS for the Build page, then the two modules, then the app.
    // Each is optional except the app: a missing module only disables its page.
    var chain = ["vendor/xlsx.full.min.js", "vendor/pptxgen.bundle.js", "CTS_build.js", "CTS_email.js", "CTS_deck.js"];
    var j = 0;
    function nextModule() {
      if (j >= chain.length) return app();
      var m = document.createElement("script");
      m.src = chain[j++];
      progress(m.src.replace(/^.*\//, "").replace(/\..*$/, ""));
      m.onload = nextModule;
      m.onerror = function () { console.warn("Optional module missing: " + m.src); nextModule(); };
      document.head.appendChild(m);
    }
    nextModule();
  }
  function app() {
    var s = document.createElement("script");
    s.src = "CTS_bi_bundle.js";
    s.onload = function () { window.CTS.boot(); };
    s.onerror = function () {
      document.getElementById("splash").innerHTML =
        '<div class="fatal"><h1>Application failed to load</h1>' +
        '<p>CTS_bi_bundle.js could not be loaded.</p></div>';
    };
    document.head.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
